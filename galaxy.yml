namespace: h0pers
name: vps
version: 1.1.0
readme: README.md
authors:
  - Dmytro Hryshchenko
description: Configure Ubuntu VPS servers that host Docker apps behind a shared Traefik proxy
license:
  - MIT
tags:
  - docker
  - traefik
  - security
  - infrastructure
dependencies:
  ansible.posix: ">=2.2.2,<3.0.0"
  community.docker: ">=5.4.0,<6.0.0"
