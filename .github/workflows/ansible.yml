name: Ansible

on:
  workflow_call:
    inputs:
      apply:
        description: Apply changes (false runs --check --diff)
        type: boolean
        default: false
      limit:
        description: Limit to hosts (e.g. blog or blog,shop)
        type: string
        default: ""
      environment:
        description: GitHub environment that holds ANSIBLE_SSH_PRIVATE_KEY
        type: string
        default: production
    secrets:
      ANSIBLE_SSH_PRIVATE_KEY:
        description: Private key for the admin user; read from the environment
        required: false

jobs:
  ansible:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: ansible
    permissions:
      contents: read
    env:
      ANSIBLE_PIPELINING: "true"
      ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
      ANSIBLE_RETRY_FILES_ENABLED: "false"
      ANSIBLE_INTERPRETER_PYTHON: auto_silent

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ansible and collections
        run: |
          pip install ansible-core==2.21.5
          ansible-galaxy collection install -r requirements.yml

      - name: Write SSH credentials
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp known_hosts ~/.ssh/known_hosts

      - name: Run playbook
        env:
          APPLY: ${{ inputs.apply }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(-i inventory.yml --diff)
          if [ "$APPLY" != "true" ]; then
            args+=(--check)
          fi
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          ansible-playbook h0pers.vps.site "${args[@]}"
