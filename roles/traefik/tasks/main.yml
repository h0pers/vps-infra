- name: Require ACME email
  ansible.builtin.assert:
    that: traefik_acme_email is defined and traefik_acme_email | length > 0
    fail_msg: traefik_acme_email must be set in the inventory

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_dir }}/letsencrypt"
    - "{{ traefik_dir }}/logs"

- name: Create ACME storage
  ansible.builtin.file:
    path: "{{ traefik_dir }}/letsencrypt/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve

- name: Create access log
  ansible.builtin.file:
    path: "{{ traefik_dir }}/logs/access.log"
    state: touch
    owner: root
    group: root
    mode: "0644"
    access_time: preserve
    modification_time: preserve

- name: Copy Traefik compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ traefik_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write Traefik environment
  ansible.builtin.copy:
    dest: "{{ traefik_dir }}/.env"
    content: "ACME_EMAIL={{ traefik_acme_email }}\n"
    owner: root
    group: root
    mode: "0644"
  diff: false

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present

- name: Rotate Traefik access logs
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/traefik
    owner: root
    group: root
    mode: "0644"
